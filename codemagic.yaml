workflows:
  wallify-4k:
    name: Wallify 4K APK
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate Android folder if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/bundle/*.aab
